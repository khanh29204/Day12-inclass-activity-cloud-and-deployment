services:
  agent:
    image: day12
    ports:
      - "${HOST_PORT:-8000}:${PORT:-8000}"
    environment:
      - APP_API_KEY=${APP_API_KEY}
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/health' % os.getenv('PORT','8000'), timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
